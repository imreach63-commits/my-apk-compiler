name: Play-Store-Ready Universal Code-to-AAB Compiler

on:
  workflow_dispatch:
    inputs:
      code_source_type:
        description: 'Source Input Type'
        required: true
        default: 'raw_code'
        type: choice
        options:
          - raw_code
          - zip_url
      raw_code_input:
        description: 'Paste Raw Code / Architecture / Blueprint Here'
        required: false
        type: string
      zip_file_url:
        description: 'URL of Zip File containing source code/repo'
        required: false
        type: string

jobs:
  universal-build:
    name: Transpile, Inject Services, Sign & Package Production AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Base Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Free AI Dependencies
        run: pip install huggingface_hub requests

      # Step 1: Process Source Code
      - name: Extract and Preprocess Source Code
        run: |
          python -c "
          import os, requests, zipfile, io

          source_type = '''${{ github.event.inputs.code_source_type }}'''
          zip_url = '''${{ github.event.inputs.zip_file_url }}'''

          if source_type == 'zip_url' and zip_url:
              r = requests.get(zip_url)
              z = zipfile.ZipFile(io.BytesIO(r.content))
              z.extractall('./input_source')
          else:
              os.makedirs('./input_source', exist_ok=True)
              with open('./input_source/raw_input.txt', 'w') as f:
                  f.write('''${{ github.event.inputs.raw_code_input }}''')
          "

      # Step 2: Advanced Free AI Transpiler Engine (HuggingFace Serverless Inference - Zero Cost)
      - name: Transpile Code using Free Llama-3 Model & Inject Ecosystem Services
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
        run: |
          python -c "
          import os, json, re
          from huggingface_hub import InferenceClient

          # Free HuggingFace Inference Endpoint using Qwen/Qwen2.5-Coder-32B-Instruct
          client = InferenceClient(model='Qwen/Qwen2.5-Coder-32B-Instruct')

          admob_app = os.environ.get('ADMOB_APP_ID', 'ca-app-pub-3940256099942544~3347511713')
          admob_banner = os.environ.get('ADMOB_BANNER_ID', 'ca-app-pub-3940256099942544/6300978111')
          razorpay_key = os.environ.get('RAZORPAY_KEY_ID', 'rzp_test_1DP5mmOlF5G5ag')

          source_context = ''
          for root, dirs, files in os.walk('./input_source'):
              for file in files:
                  path = os.path.join(root, file)
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          source_context += f'\n--- FILE: {file} ---\n' + f.read()[:2000]
                  except Exception:
                      pass

          sys_instruction = f'''You are an Expert Lead Architect.
          Convert input blueprint into a production-ready, highly architectural Flutter project.
          Required Package Integrations in pubspec.yaml and source files:
          1. google_mobile_ads (App ID: {admob_app}, Banner ID: {admob_banner})
          2. razorpay_flutter (Key ID: {razorpay_key})
          3. firebase_core & firebase_auth
          4. provider or flutter_bloc for state management
          5. Ensure AndroidManifest.xml has Internet permission and AdMob Meta Data.

          Output MUST be valid JSON mapping file path to string file content ONLY. No explanation.'''

          response = client.chat_completion(
              messages=[
                  {'role': 'system', 'content': sys_instruction},
                  {'role': 'user', 'content': f'Build advanced production Flutter code for:\n{source_context}'}
              ],
              max_tokens=4096,
              temperature=0.2
          )

          raw_out = response.choices[0].message.content
          json_match = re.search(r'\{.*\}', raw_out, re.DOTALL)
          
          if json_match:
              files = json.loads(json_match.group(0))
              for filepath, content in files.items():
                  os.makedirs(os.path.dirname(filepath), exist_ok=True)
                  with open(filepath, 'w') as f:
                      f.write(content)
          else:
              raise ValueError('AI did not return a valid JSON structure.')
          "

      - name: Inject Firebase Config (If Provided)
        env:
          FIREBASE_OPTIONS_BASE64: ${{ secrets.FIREBASE_OPTIONS_BASE64 }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_BASE64" ]; then
            echo "$FIREBASE_OPTIONS_BASE64" | base64 -d > lib/firebase_options.dart
          fi

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 3: Auto-Inject Signing Configuration
      - name: Auto-Inject Signing Configuration
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -storepass "androidkey" -alias "upload" -keypass "androidkey" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Developer, OU=Dev, O=App, L=City, S=State, C=US"

          cat <<EOF > android/key.properties
          storePassword=androidkey
          keyPassword=androidkey
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

          python -c "
          import os

          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  content = f.read()

              signing_code = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
              if 'keystoreProperties' not in content:
                  content = signing_code + content

              if 'signingConfigs {' in content and 'release {' not in content:
                  content = content.replace('signingConfigs {', '''signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }''')

              with open(gradle_path, 'w') as f:
                  f.write(content)
          "

      - name: Fetch Dependencies
        run: flutter pub get || flutter pub upgrade

      # Step 4: Compile Production App Bundle (.aab) & APK with Self-Healing Engine
      - name: Build Signed Production Releases
        run: |
          if ! flutter build appbundle --release; then
            echo "AAB build failed. Executing Autonomous Self-Healing Engine via Free HuggingFace LLM..."
            python -c "
            import os, json, re
            from huggingface_hub import InferenceClient

            client = InferenceClient(model='Qwen/Qwen2.5-Coder-32B-Instruct')
            
            sys_instruction = 'Fix Flutter compilation and dependency errors for release build. Output ONLY JSON mapping file paths to updated raw file strings.'
            response = client.chat_completion(
                messages=[
                    {'role': 'system', 'content': sys_instruction},
                    {'role': 'user', 'content': 'Fix syntax or pubspec dependencies for build.'}
                ],
                max_tokens=4096
            )
            raw_out = response.choices[0].message.content
            json_match = re.search(r'\{.*\}', raw_out, re.DOTALL)
            if json_match:
                files = json.loads(json_match.group(0))
                for filepath, content in files.items():
                    with open(filepath, 'w') as f:
                        f.write(content)
            "
            flutter pub get
            flutter build appbundle --release
          fi
          flutter build apk --release

      # Step 5: Upload Play Store Ready Artifacts
      - name: Upload Play Store App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: Play-Store-Ready-AppBundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Production-Signed-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
