name: Universal-Autonomous-Production-Compiler-Verified

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Binaries (APK/AAB)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto Generate & Build APK
        run: |
          flutter create dummy_app
          cd dummy_app
          flutter pub get
          flutter build apk --release
          mkdir -p ../output_release
          cp build/app/outputs/flutter-apk/app-release.apk ../output_release/app-release.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android-Binaries
          retention-days: 14
          path: output_release/*
          
