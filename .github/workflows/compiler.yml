name: Universal-Autonomous-Production-Compiler-Verified

on:
  workflow_dispatch:
    inputs:
      code_source_type:
        description: 'Source Input Type'
        required: true
        default: 'raw_code'
        type: choice
        options:
          - raw_code
          - zip_url
      zip_file_url:
        description: 'URL of Zip File containing source code'
        required: false
        type: string
      raw_code_input:
        description: 'Paste Raw Code or App Prompt Here'
        required: false
        type: string
      create_release:
        description: 'Create GitHub Release and Attach Binaries?'
        required: true
        type: boolean
        default: true

jobs:
  build-android:
    name: Build Android Binaries (APK/AAB)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare Code and Environment
        env:
          SOURCE_TYPE: ${{ github.event.inputs.code_source_type }}
          ZIP_URL: ${{ github.event.inputs.zip_file_url }}
          RAW_CODE: ${{ github.event.inputs.raw_code_input }}
        run: |
          python3 -c "
          import os, requests, zipfile, shutil, subprocess

          source_type = os.environ.get('SOURCE_TYPE')
          zip_url = os.environ.get('ZIP_URL')
          raw_code = os.environ.get('RAW_CODE', '')

          if source_type == 'zip_url' and zip_url:
              r = requests.get(zip_url)
              with open('app.zip', 'wb') as f:
                  f.write(r.content)
              with zipfile.ZipFile('app.zip', 'r') as zip_ref:
                  zip_ref.extractall('extracted_app')
          else:
              subprocess.run(['flutter', 'create', '--org', 'com.universal.app', '--project-name', 'universal_app', '.', '--force'], check=True)
              if raw_code.strip():
                  os.makedirs('lib', exist_ok=True)
                  with open('lib/main.dart', 'w') as f:
                      f.write(raw_code)
          "

      - name: Build Android App (APK/AAB)
        run: |
          mkdir -p output_release
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
            flutter build apk --release || true
            flutter build appbundle --release || true
          fi
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} output_release/ \; 2>/devnull || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android-Binaries
          retention-days: 14
          path: output_release/*

  release:
    name: Consolidated GitHub Release
    needs: [build-android]
    if: always() && needs.build-android.result == 'success' && github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: combined_artifacts

      - name: Package Assets
        run: |
          mkdir -p final_release
          find combined_artifacts/ -type f -exec cp {} final_release/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-v${{ github.run_number }}
          name: Autonomous Release #${{ github.run_number }}
          body: "Automated production binaries compiled successfully."
          files: final_release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
