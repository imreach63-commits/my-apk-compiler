name: Play-Store-Ready Universal Code-to-AAB Compiler

on:
  workflow_dispatch:
    inputs:
      code_source_type:
        description: 'Source Input Type'
        required: true
        default: 'raw_code'
        type: choice
        options:
          - raw_code
          - zip_url
      raw_code_input:
        description: 'Paste Raw Code / Architecture / Blueprint Here'
        required: false
        type: string
      zip_file_url:
        description: 'URL of Zip File containing source code/repo'
        required: false
        type: string

jobs:
  universal-build:
    name: Transpile, Inject Services, Sign & Package Production AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python AI Requirements
        run: pip install huggingface_hub requests

      - name: Initialize Clean App Structure
        run: |
          rm -rf lib android ios pubspec.yaml pubspec.lock
          flutter create --org com.senior.companion --project-name senior_companion .

      - name: Generate Senior Companion App Code
        run: |
          python -c "
          import os, json, re
          from huggingface_hub import InferenceClient

          prompt = '''${{ github.event.inputs.raw_code_input }}'''
          client = InferenceClient(model='Qwen/Qwen2.5-Coder-32B-Instruct')

          sys_instruction = '''You are a Flutter Lead Architect. Generate complete, working Flutter UI Dart code for a Senior Citizen Caregiver App with medication reminders, emergency SOS alert button, and clean large-font UI. Return ONLY valid JSON where key is 'lib/main.dart' and value is full code.'''

          try:
              response = client.chat_completion(
                  messages=[
                      {'role': 'system', 'content': sys_instruction},
                      {'role': 'user', 'content': f'Create full interactive UI code for: {prompt}'}
                  ],
                  max_tokens=3000
              )
              raw_out = response.choices[0].message.content
              json_match = re.search(r'\{.*\}', raw_out, re.DOTALL)
              if json_match:
                  files = json.loads(json_match.group(0))
                  if 'lib/main.dart' in files:
                      with open('lib/main.dart', 'w') as f:
                          f.write(files['lib/main.dart'])
          except Exception as e:
              print(f'AI Injection Error: {e}')
          "

      - name: Auto-Sign Android Configuration
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -storepass "androidkey" -alias "upload" -keypass "androidkey" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Developer, OU=Dev, O=App, L=City, S=State, C=US"

          cat <<EOF > android/key.properties
          storePassword=androidkey
          keyPassword=androidkey
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Signed App Bundle (.aab)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Build Signed APK (.apk)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Play Store Ready AppBundle
        uses: actions/upload-artifact@v4
        with:
          name: Play-Store-Ready-AppBundle
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Production Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Production-Signed-APK
          path: build/app/outputs/flutter-apk/app-release.apk
