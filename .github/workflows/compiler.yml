name: Play-Store-Ready Universal Code-to-AAB Compiler

on:
  workflow_dispatch:
    inputs:
      code_source_type:
        description: 'Source Input Type'
        required: true
        default: 'zip_url'
        type: choice
        options:
          - zip_url
          - raw_code
      zip_file_url:
        description: 'URL of Zip File containing source code/repo'
        required: false
        type: string
      raw_code_input:
        description: 'Paste Raw Code / Architecture / Blueprint Here'
        required: false
        type: string

jobs:
  universal-build:
    name: Build & Package Production APK and Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Helper Dependencies
        run: pip install requests huggingface_hub

      # Step 1: Process and Extract Source Code (Zip URL or Raw Code)
      - name: Process Source Code Input
        run: |
          python -c "
          import os, requests, zipfile, io, json, re
          from huggingface_hub import InferenceClient

          source_type = '''${{ github.event.inputs.code_source_type }}'''
          zip_url = '''${{ github.event.inputs.zip_file_url }}'''
          raw_code = '''${{ github.event.inputs.raw_code_input }}'''

          # Case A: User uploaded ZIP File via URL
          if source_type == 'zip_url' and zip_url:
              print('Downloading Zip file from URL...')
              r = requests.get(zip_url)
              z = zipfile.ZipFile(io.BytesIO(r.content))
              
              # Find root directory in zip if wrapped
              temp_dir = './temp_zip'
              z.extractall(temp_dir)
              
              # Move contents to root workspace
              for root, dirs, files in os.walk(temp_dir):
                  if 'pubspec.yaml' in files or 'main.dart' in files:
                      for item in os.listdir(root):
                          s = os.path.join(root, item)
                          d = os.path.join('.', item)
                          if os.path.isdir(s):
                              os.system(f'cp -r {s} .')
                          else:
                              os.system(f'cp {s} .')
                      break

          # Case B: User pasted Raw Code / Single File
          elif source_type == 'raw_code' and raw_code:
              print('Processing Raw Code Input...')
              if not os.path.exists('pubspec.yaml'):
                  os.system('flutter create --org com.universal.app --project-name universal_app . --force')
              
              # Write pasted raw code into lib/main.dart
              os.makedirs('lib', exist_ok=True)
              with open('lib/main.dart', 'w') as f:
                  f.write(raw_code)
          "

      # Step 2: Auto-Inject All Required Android Permissions into AndroidManifest.xml
      - name: Inject Dynamic Android Permissions
        run: |
          python -c "
          import os, re

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()

              permissions = '''
              <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>
              <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>
              <uses-permission android:name=\"android.permission.CAMERA\"/>
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>
              <uses-permission android:name=\"android.permission.CALL_PHONE\"/>
              <uses-permission android:name=\"android.permission.SEND_SMS\"/>
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"/>
              <uses-permission android:name=\"android.permission.BLUETOOTH\"/>
              <uses-permission android:name=\"android.permission.VIBRATE\"/>
              '''

              if '<uses-permission' not in content:
                  content = content.replace('<manifest', '<manifest\n' + permissions)
                  with open(manifest_path, 'w') as f:
                      f.write(content)
          "

      # Step 3: Setup Keystore Digital Signing
      - name: Auto-Sign Android Configuration
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -storepass "androidkey" -alias "upload" -keypass "androidkey" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Developer, OU=Dev, O=App, L=City, S=State, C=US"

          cat <<EOF > android/key.properties
          storePassword=androidkey
          keyPassword=androidkey
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

          python -c "
          import os

          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  content = f.read()

              signing_code = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
              if 'keystoreProperties' not in content:
                  content = signing_code + content

              if 'signingConfigs {' in content and 'release {' not in content:
                  content = content.replace('signingConfigs {', '''signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }''')

              with open(gradle_path, 'w') as f:
                  f.write(content)
          "

      # Step 4: Resolve & Download All Native Dependencies
      - name: Resolve Dependencies
        run: flutter pub get || flutter pub upgrade

      # Step 5: Build Releases (Signed Production APK & AAB)
      - name: Build Signed App Bundle (.aab)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Build Signed APK (.apk)
        run: flutter build apk --release --no-tree-shake-icons

      # Step 6: Upload Output Files
      - name: Upload Play Store Ready AppBundle
        uses: actions/upload-artifact@v4
        with:
          name: Play-Store-Ready-AppBundle
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Production Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Production-Signed-APK
          path: build/app/outputs/flutter-apk/app-release.apk
