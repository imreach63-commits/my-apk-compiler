name: Universal-Autonomous-Production-Compiler-Verified

on:
  workflow_dispatch:
    inputs:
      code_source_type:
        description: 'Source Input Type'
        required: true
        default: 'zip_url'
        type: choice
        options:
          - zip_url
          - raw_code
      zip_file_url:
        description: 'URL of Zip File containing source code/repo'
        required: false
        type: string
      raw_code_input:
        description: 'Paste Raw Code / Architecture / Blueprint Here'
        required: false
        type: string
      create_release:
        description: 'Create GitHub Release and Attach Binaries?'
        required: true
        type: boolean
        default: true

jobs:
  build-android:
    name: Build Android Binaries (APK/AAB)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract Code from Source
        env:
          SOURCE_TYPE: ${{ github.event.inputs.code_source_type }}
          ZIP_URL: ${{ github.event.inputs.zip_file_url }}
          RAW_CODE: ${{ github.event.inputs.raw_code_input }}
        run: |
          if [ "$SOURCE_TYPE" = "zip_url" ] && [ -n "$ZIP_URL" ]; then
            echo "Installing gdown for reliable Google Drive downloads..."
            python3 -m pip install --upgrade gdown

            echo "Downloading source file..."
            gdown --fuzzy "$ZIP_URL" -O downloaded_repo.zip

            mkdir -p temp_extract
            unzip -q -o downloaded_repo.zip -d temp_extract
            rm -f downloaded_repo.zip

            TARGET_DIR=$(find temp_extract -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
            
            if [ -n "$TARGET_DIR" ]; then
              echo "Found Flutter project at $TARGET_DIR"
              cp -r $TARGET_DIR/* .
            else
              echo "pubspec.yaml not found, moving all files..."
              cp -r temp_extract/* .
            fi
            rm -rf temp_extract

          elif [ "$SOURCE_TYPE" = "raw_code" ] && [ -n "$RAW_CODE" ]; then
            echo "Building from Raw Main Dart Code..."
            flutter create --org com.hyperlocal.app --project-name hyperlocal_app . --force
            mkdir -p lib
            echo "$RAW_CODE" > lib/main.dart
          fi

      - name: Build Android Targets (APK & AAB)
        run: |
          mkdir -p output_release

          if [ -f "pubspec.yaml" ]; then
            flutter pub get
            flutter build apk --release
            flutter build appbundle --release
          else
            echo "::error::No Flutter project found to build."
            exit 1
          fi

          find build/app/outputs/ -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} output_release/ \; 2>/devnull || true

          if [ -z "$(ls -A output_release)" ]; then
            echo "::error::Android Build Failed - No APK or AAB generated."
            exit 1
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android-Binaries
          retention-days: 14
          path: output_release/*

  release:
    name: Consolidated GitHub Release
    needs: [build-android]
    if: always() && needs.build-android.result == 'success' && github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: combined_artifacts

      - name: Package Assets
        run: |
          mkdir -p final_release
          find combined_artifacts/ -type f -exec cp {} final_release/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-v${{ github.run_number }}
          name: Android Production Release #${{ github.run_number }}
          body: "Automated Android APK and AAB binaries compiled successfully."
          files: final_release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
