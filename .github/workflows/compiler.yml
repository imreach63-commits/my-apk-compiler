name: Play-Store-Ready Universal Code-to-AAB Compiler

on:
  workflow_dispatch:
    inputs:
      code_source_type:
        description: 'Source Input Type'
        required: true
        default: 'raw_code'
        type: choice
        options:
          - raw_code
          - zip_url
      raw_code_input:
        description: 'Paste Raw Code / Architecture / Blueprint Here'
        required: false
        type: string
      zip_file_url:
        description: 'URL of Zip File containing source code/repo'
        required: false
        type: string

jobs:
  universal-build:
    name: Transpile, Sign & Package Production AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Base Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install openai requests

      # Step 1: Process Source Code
      - name: Extract and Preprocess Source Code
        run: |
          python -c "
          import os, requests, zipfile, io

          source_type = '''${{ github.event.inputs.code_source_type }}'''
          zip_url = '''${{ github.event.inputs.zip_file_url }}'''

          if source_type == 'zip_url' and zip_url:
              r = requests.get(zip_url)
              z = zipfile.ZipFile(io.BytesIO(r.content))
              z.extractall('./input_source')
          else:
              os.makedirs('./input_source', exist_ok=True)
              with open('./input_source/raw_input.txt', 'w') as f:
                  f.write('''${{ github.event.inputs.raw_code_input }}''')
          "

      # Step 2: AI Code Generation
      - name: Transpile Code to Flutter Architecture
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -c "
          import os, json
          from openai import OpenAI

          client = OpenAI(api_key=os.environ.get('OPENAI_API_KEY'))

          source_context = ''
          for root, dirs, files in os.walk('./input_source'):
              for file in files:
                  path = os.path.join(root, file)
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          source_context += f'\n--- FILE: {file} ---\n' + f.read()[:2000]
                  except Exception:
                      pass

          sys_instruction = '''You are a Senior Flutter Engineer. 
          Generate a production-ready, fully functional Flutter App structure.
          Return ONLY a JSON object mapping file paths to raw string file contents.'''

          response = client.chat.completions.create(
              model='gpt-4o',
              max_tokens=4096,
              response_format={'type': 'json_object'},
              messages=[
                  {'role': 'system', 'content': sys_instruction},
                  {'role': 'user', 'content': f'Generate full Flutter architecture for:\n{source_context}'}
              ]
          )

          files = json.loads(response.choices[0].message.content)
          for filepath, content in files.items():
              os.makedirs(os.path.dirname(filepath), exist_ok=True)
              with open(filepath, 'w') as f:
                  f.write(content)
          "

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 3: Auto-Inject Signing Logic into build.gradle & Create Keystore
      - name: Auto-Inject Signing Configuration
        run: |
          # Keystore Generate करना
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -storepass "androidkey" -alias "upload" -keypass "androidkey" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Developer, OU=Dev, O=App, L=City, S=State, C=US"

          # key.properties File बनाना
          cat <<EOF > android/key.properties
          storePassword=androidkey
          keyPassword=androidkey
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

          # Python के ज़रिए build.gradle में ऑटोमैटिक साइनिंग जोड़ना
          python -c "
          import os

          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  content = f.read()

              signing_code = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
              if 'keystoreProperties' not in content:
                  content = signing_code + content

              if 'signingConfigs {' in content and 'release {' not in content:
                  content = content.replace('signingConfigs {', '''signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }''')

              with open(gradle_path, 'w') as f:
                  f.write(content)
          "

      - name: Fetch Dependencies
        run: flutter pub get || flutter pub upgrade

      # Step 4: Compile Production App Bundle (.aab) & APK
      - name: Build Signed Production Releases
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if ! flutter build appbundle --release; then
            echo "AAB build failed. Executing Self-Healing..."
            python -c "
            import os, json
            from openai import OpenAI
            client = OpenAI(api_key=os.environ.get('OPENAI_API_KEY'))
            
            sys_instruction = 'Fix the compilation issue for Flutter release build. Return ONLY a JSON object mapping relative file path to file content.'
            response = client.chat.completions.create(
                model='gpt-4o',
                max_tokens=4096,
                response_format={'type': 'json_object'},
                messages=[
                    {'role': 'system', 'content': sys_instruction},
                    {'role': 'user', 'content': 'Fix syntax or pubspec dependencies for build.'}
                ]
            )
            files = json.loads(response.choices[0].message.content)
            for filepath, content in files.items():
                with open(filepath, 'w') as f:
                    f.write(content)
            "
            flutter pub get
            flutter build appbundle --release
          fi
          flutter build apk --release

      # Step 5: Upload Play Store Ready Artifacts
      - name: Upload Play Store App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: Play-Store-Ready-AppBundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Production-Signed-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
