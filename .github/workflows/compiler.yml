name: Play-Store-Ready Universal Code-to-AAB Compiler

on:
  workflow_dispatch:
    inputs:
      code_source_type:
        description: 'Source Input Type'
        required: true
        default: 'raw_code'
        type: choice
        options:
          - raw_code
          - zip_url
      raw_code_input:
        description: 'Paste Raw Code / Architecture / Blueprint Here'
        required: false
        type: string
      zip_file_url:
        description: 'URL of Zip File containing source code/repo'
        required: false
        type: string

jobs:
  universal-build:
    name: Transpile, Inject Services, Sign & Package Production AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Base Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install huggingface_hub requests

      - name: Initialize Clean Flutter App
        run: |
          rm -rf lib android ios web pubspec.yaml pubspec.lock
          flutter create --org com.universal.seniorcompanion --project-name senior_companion .

      - name: Generate Code via Free AI Engine
        continue-on-error: true
        run: |
          python -c "
          import os, json, re
          from huggingface_hub import InferenceClient

          prompt = '''${{ github.event.inputs.raw_code_input }}'''
          client = InferenceClient(model='Qwen/Qwen2.5-Coder-32B-Instruct')

          sys_instruction = '''You are a Flutter expert. Output ONLY valid JSON mapping file paths to Dart file code.
          Example: {\"lib/main.dart\": \"import 'package:flutter/material.dart'; void main() => runApp(MaterialApp(home: Scaffold(body: Center(child: Text('Senior Companion App')))));\"}'''

          try:
              response = client.chat_completion(
                  messages=[
                      {'role': 'system', 'content': sys_instruction},
                      {'role': 'user', 'content': f'Write Flutter main.dart code for: {prompt}'}
                  ],
                  max_tokens=2048
              )
              raw_out = response.choices[0].message.content
              json_match = re.search(r'\{.*\}', raw_out, re.DOTALL)
              if json_match:
                  files = json.loads(json_match.group(0))
                  for filepath, content in files.items():
                      os.makedirs(os.path.dirname(filepath), exist_ok=True)
                      with open(filepath, 'w') as f:
                          f.write(content)
          except Exception as e:
              print(f'AI Code Generation Error: {e}')
          "

      - name: Setup Keystore Signing
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -storepass "androidkey" -alias "upload" -keypass "androidkey" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Developer, OU=Dev, O=App, L=City, S=State, C=US"

          cat <<EOF > android/key.properties
          storePassword=androidkey
          keyPassword=androidkey
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build App Bundle (.aab)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Build APK (.apk)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Play Store Ready AppBundle
        uses: actions/upload-artifact@v4
        with:
          name: Play-Store-Ready-AppBundle
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Production-Signed-APK
          path: build/app/outputs/flutter-apk/app-release.apk
